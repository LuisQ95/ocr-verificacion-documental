name: Pylint

on:
  push:
  pull_request:
    branches: [ "main", "desarrollo" ]

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies (torch en CPU, las versiones exactas de requirements-lock.txt)
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        sed -e 's/+cu130//' -e 's#whl/cu130#whl/cpu#' requirements-lock.txt > requisitos-ci.txt
        pip install -r requisitos-ci.txt
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
